name: Deploy to GitHub Pages

on:
  # Only `main` may deploy: the github-pages environment's branch policy
  # allows main only (other branches are rejected at the deploy step).
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./fantasy-league
        run: npm ci

      - name: Build
        working-directory: ./fantasy-league
        env:
          GITHUB_PAGES: 'true'
        run: |
          npx vite build
          # SPA fallback: GitHub Pages serves 404.html for deep links like
          # /1122/sportsurge — returning the app lets React Router handle it.
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./fantasy-league/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
