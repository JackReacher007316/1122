# ─── Nginx Reverse Proxy Configuration for FOFA ───────────────────────────────
# Place this configuration inside your Nginx site config file 
# (e.g. /etc/nginx/sites-available/fofa on Ubuntu/Debian)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name fofa.local; # Replace with your domain name or server IP

    # Point root to your compiled React dist directory
    root /var/www/html/dist;
    index index.html;

    # ─── Serve Static Assets Directly ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Reverse Proxy API Requests to Node.js ────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Support for Live Streams/Watch Parties
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
