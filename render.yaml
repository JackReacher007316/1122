services:
  - type: web
    name: iiitn-streaming-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: >
      cd fantasy-league && npm install && npm run build &&
      cd ../backend && npm install && npx prisma generate
    startCommand: "cd backend && npx prisma db push --accept-data-loss --skip-generate && node seed.js && node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: iiitn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: iiitn-db
    plan: free
    databaseName: iiitn_streaming
    user: iiitn_user
    region: oregon
