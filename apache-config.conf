# ─── Apache VirtualHost Configuration for FOFA ─────────────────────────────────
# Place this configuration inside your Apache site config file 
# (e.g. /etc/apache2/sites-available/fofa.conf on Ubuntu/Debian)
# ─────────────────────────────────────────────────────────────────────────────

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName fofa.local
    # ServerAlias www.yourdomain.com

    # Point DocumentRoot to your compiled React dist directory
    DocumentRoot /var/www/html/dist

    # ─── Enable Reverse Proxy to Node.js Backend ──────────────────────────────
    # Ensures Apache routes all /api endpoints to Node Express on port 3000
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api
    
    # Websocket Support (if using Live Stream Watch Parties)
    ProxyPass /socket.io http://127.0.0.1:3000/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:3000/socket.io

    # ─── Serve Static Assets & Client-side Route Rewrites ──────────────────────
    <Directory /var/www/html/dist>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted

        # Fallback all non-file/non-dir routes to React index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # ─── Logging ──────────────────────────────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/fofa_error.log
    CustomLog ${APACHE_LOG_DIR}/fofa_access.log combined
</VirtualHost>
