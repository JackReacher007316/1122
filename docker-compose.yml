# ─── Fantasy League – Docker Compose ─────────────────────────────────────────
# Runs the full stack in containers:
#   • db       → PostgreSQL 16                        (port 5432)
#   • backend  → Node.js + Express + Prisma           (port 3000)
#   • frontend → React + Vite dev server               (port 5173)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fantasy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iiitn_user
      POSTGRES_PASSWORD: iiitn_pass
      POSTGRES_DB: iiitn_streaming
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - fantasy_net

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fantasy_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-supersecret_jwt_key_for_fantasy_league}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql://iiitn_user:iiitn_pass@db:5432/iiitn_streaming
    depends_on:
      - db
    networks:
      - fantasy_net

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./fantasy-league
      dockerfile: Dockerfile
    container_name: fantasy_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - fantasy_net

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  pg_data:
    name: fantasy_pg_data

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  fantasy_net:
    name: fantasy_network
    driver: bridge
