# ─── Fantasy League – Docker Compose ─────────────────────────────────────────
# Runs the full stack in containers:
#   • db       → PostgreSQL 16                        (port 5432)
#   • backend  → Node.js + Express + Prisma           (port 3000)
# The backend serves the built frontend as static files.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: fantasy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iiitn_user
      POSTGRES_PASSWORD: iiitn_pass
      POSTGRES_DB: iiitn_streaming
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - fantasy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iiitn_user -d iiitn_streaming"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (serves frontend static files too) ─────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fantasy_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-supersecret_jwt_key_for_fantasy_league}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql://iiitn_user:iiitn_pass@db:5432/iiitn_streaming
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fantasy_net

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  pg_data:
    name: fantasy_pg_data

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  fantasy_net:
    name: fantasy_network
    driver: bridge
